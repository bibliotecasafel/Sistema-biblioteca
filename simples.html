<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Acervo - CECM Santa Felicidade</title>
  <link rel="stylesheet" href="style.css">
  <script src="shared.js"></script>
</head>
<body>

  <div id="login-screen" class="panel" style="max-width:400px; margin-top:50px; display:none;">
    <h2 style="text-align: center; font-size: 1.1rem; border:none; margin-bottom:5px;">Sistema de Acervo<br>CECM Santa Felicidade</h2>
    <hr style="margin-bottom: 15px; border: 0; border-top: 1px solid #ddd;">
    <div class="input-group"><label>E-mail</label><input type="email" id="l-email"></div>
    <div class="input-group"><label>Senha</label><input type="password" id="l-senha"></div>
    <button id="btn-login" class="btn-blue" style="width:100%;">Entrar</button>
    <div id="login-msg" style="color:red; font-size:0.85rem; margin-top:10px;"></div>
  </div>

  <div id="app-screen" style="display:none; padding-bottom: 80px;">
    <div class="panel">
      <h2>Cadastrar Livro Rápido</h2>
      <div class="input-group">
        <label>ISBN (ou use o scanner)</label>
        <div style="display:flex; gap:5px;">
          <input type="text" id="isbn" placeholder="978...">
          <button class="btn-primary" onclick="window.open('leitor.html', 'Leitor', 'width=500,height=700')">📷</button>
        </div>
      </div>
      <div class="input-group"><label>Número do Livro (ID)</label><input type="text" id="numero"></div>
      <div class="input-group"><label>Título</label><input type="text" id="titulo"></div>
      <div class="input-group"><label>Autor</label><input type="text" id="autor"></div>
      <div class="input-group"><label>Editora</label><input type="text" id="editora"></div>
      <div class="input-group"><label>Gênero</label><input type="text" id="genero"></div>
      <button id="btn-salvar" class="btn-primary" style="width:100%; margin-top:10px;">Salvar Livro</button>
      <div id="msg" style="margin-top:10px; font-weight:bold;"></div>
    </div>

    <div class="panel">
      <h2>Acervo Recente</h2>
      <input type="text" id="busca" placeholder="Buscar..." style="width:100%; padding:8px; margin-bottom:15px; border:1px solid #ccc;">
      <div class="table-responsive">
        <table id="tabela">
          <thead><tr><th>ID</th><th>Título</th><th>Autor</th><th>ISBN</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <button class="floating-menu-btn" id="menu-btn">☰</button>
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><h3>Menu</h3><p id="user-name">Usuário</p></div>
    <ul>
      <li><a href="index.html">🏠 Sistema Completo</a></li>
      <li><a href="#" style="background:var(--bg); color:var(--primary);">📚 Acervo Simples</a></li>
      <li><a href="#" onclick="window.open('leitor.html', 'Leitor', 'width=500,height=700')">📷 Abrir Scanner</a></li>
      <li><a href="#" id="btn-sair" class="logout">🚪 Sair</a></li>
    </ul>
  </aside>

  <script src="simples.js"></script>
</body>
</html>
